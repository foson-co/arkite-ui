# -------------------------------------------------------------------
# Which pipelines get created at all.
#
# Pipelines are created per *event*, so pushing to a branch that already
# has an open MR fires twice — once as `push`, once as
# `merge_request_event` — and runs every job twice on the same SHA. That
# costs real wall-clock here: shared runners are disabled, so everything
# queues on the self-hosted Ark-Stage runner at concurrency 2, alongside
# the rest of the ecosystem's CI.
#
# ⚠️ The $CI_COMMIT_TAG rule MUST stay first and unconditional. The tag
# pipeline is the ONLY channel that publishes to npm (see publish:npm),
# and this block decides whether that pipeline exists at all — a mistake
# here does not fail loudly, it silently publishes nothing. This path
# cannot be exercised by an MR pipeline; it is first proven at release.
# -------------------------------------------------------------------
workflow:
  rules:
    # Release: tag pipeline. Must come first — see warning above.
    - if: $CI_COMMIT_TAG
    # MR pipeline: the one that gates merging.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Branch already has an open MR → skip; the MR pipeline covers this SHA.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Everything else: main, and branches pushed before their MR exists.
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - build
  - publish

default:
  tags:
    - Ark-Stage

# -------------------------------------------------------------------
# Shared Templates
# -------------------------------------------------------------------

.node-setup: &node-setup
  image: node:22-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  before_script:
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts

# -------------------------------------------------------------------
# CI: runs on every push and merge request
# -------------------------------------------------------------------

lint:
  stage: check
  <<: *node-setup
  script:
    - pnpm run lint
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

typecheck:
  stage: check
  <<: *node-setup
  script:
    - pnpm run typecheck
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

test:
  stage: check
  <<: *node-setup
  script:
    - pnpm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# RSC/SSR 環境驗證:在真 Next.js App Router 下 build + 啟動 + Chromium 實測
# 「use client」邊界(Server Component 直取 tokens)與 hydration(零 console
# error + 互動可用)。playwright 官方 image 自帶瀏覽器。
# APG 鍵盤互動規格在真 Chromium 重跑(unit 是 jsdom;真瀏覽器的焦點/鍵盤
# 語意才是最終真相)。
keyboard:browser:
  stage: check
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  cache:
    # 與 node:22-alpine(musl)的 cache 分開:同 key 共用 node_modules 會讓
    # 平台原生二進位(rollup/esbuild)在 glibc/musl 間互踩,間歇性炸 pipeline
    key: ${CI_COMMIT_REF_SLUG}-playwright
    paths:
      - node_modules/
  before_script:
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm vitest run --project keyboard-browser
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

smoke:next:
  stage: check
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  cache:
    key: ${CI_COMMIT_REF_SLUG}-playwright
    paths:
      - node_modules/
  before_script:
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm run smoke:next
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

size:
  stage: check
  <<: *node-setup
  script:
    - pnpm run build
    - pnpm run size
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# 有程式碼異動卻沒附 changeset 就擋下 MR。
# 純內部異動（不影響 consumer）用 `pnpm changeset --empty` 過閘。
changeset:check:
  stage: check
  <<: *node-setup
  # node:22-alpine ships without git, and this job's first command is a
  # `git fetch` — so it died on `git: not found` (exit 127) the first time
  # it ever ran. It only triggers on MR pipelines, and this repo had no MRs
  # until !1, so the job sat unexercised since the day it was written.
  before_script:
    - apk add --no-cache git
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    # The runner clones shallow (GIT_DEPTH 20); fetch main so --since can
    # resolve it.
    - git fetch origin main:refs/remotes/origin/main
    - pnpm changeset status --since=origin/main
  rules:
    - if: $CI_MERGE_REQUEST_IID

build:
  stage: build
  <<: *node-setup
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

chromatic:
  stage: check
  <<: *node-setup
  before_script:
    - apk add --no-cache git
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    # MR：有未 review 的視覺變更就擋（到 Chromatic 上 approve 後重跑此 job）。
    # main：MR 階段已審過，自動接受並更新 baseline。
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        pnpm exec chromatic
      else
        pnpm exec chromatic --auto-accept-changes
      fi
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CHROMATIC_PROJECT_TOKEN
    - if: $CI_COMMIT_BRANCH == "main" && $CHROMATIC_PROJECT_TOKEN

# -------------------------------------------------------------------
# Publish: only on tags on main branch
# (Storybook is deployed to GitHub Pages via .github/workflows/deploy-storybook.yml)
# -------------------------------------------------------------------

publish:gitlab:
  stage: publish
  image: node:22-alpine
  dependencies:
    - build
  variables:
    HUSKY: "0"
  before_script:
    - corepack enable && corepack prepare --activate
  script:
    - |
      echo "@arkite-ui:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${PUBLISH_TOKEN}" >> .npmrc
    - pnpm publish --no-git-checks
  rules:
    - if: $CI_COMMIT_TAG

publish:npm:
  stage: publish
  image: node:22-alpine
  dependencies:
    - build
  variables:
    HUSKY: "0"
  before_script:
    - corepack enable && corepack prepare --activate
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - pnpm publish --no-git-checks --access public
  rules:
    - if: $CI_COMMIT_TAG && $NPM_TOKEN

# -------------------------------------------------------------------
# Which pipelines get created at all.
#
# Pipelines are created per *event*, so pushing to a branch that already
# has an open MR fires twice — once as `push`, once as
# `merge_request_event` — and runs every job twice on the same SHA. That
# costs real wall-clock here: shared runners are disabled, so every job
# queues on a self-hosted runner shared with the rest of the ecosystem's
# CI (check/test/build on openhands-box, release on Ark-Stage).
#
# ⚠️ The $CI_COMMIT_TAG rule MUST stay first and unconditional. The tag
# pipeline is the ONLY channel that publishes to npm (see publish:npm),
# and this block decides whether that pipeline exists at all — a mistake
# here does not fail loudly, it silently publishes nothing. This path
# cannot be exercised by an MR pipeline; it is first proven at release.
# -------------------------------------------------------------------
workflow:
  rules:
    # Release: tag pipeline. Must come first — see warning above.
    - if: $CI_COMMIT_TAG
    # MR pipeline: the one that gates merging.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Branch already has an open MR → skip; the MR pipeline covers this SHA.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Everything else: main, and branches pushed before their MR exists.
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - build
  - publish

default:
  tags:
    - openhands-box  # check/test/build 走共享算力機；deploy 各自覆寫 Ark-Stage

# -------------------------------------------------------------------
# Shared Templates
# -------------------------------------------------------------------

.node-setup: &node-setup
  image: node:22-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  before_script:
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts

# -------------------------------------------------------------------
# CI: runs on every push and merge request
# -------------------------------------------------------------------

lint:
  stage: check
  <<: *node-setup
  script:
    - pnpm run lint
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

typecheck:
  stage: check
  <<: *node-setup
  script:
    - pnpm run typecheck
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

test:
  stage: check
  <<: *node-setup
  script:
    - pnpm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# 供應鏈稽核閘門（arkite-frontend §5.23.0，issue #23）
#
# 由來是一個不對稱：後端每個專案的 CI 都有 pip-audit，前端從來沒有對應要求
# ——實測 9 個受檢專案只有 2 個在跑 pnpm audit。而這一週前端兩個最大的安全
# 發現（arkite-frontend #19 dompurify XSS、#24 react-router 未認證 RCE）
# **都出自那兩家碰巧有在跑的**，不是被規範抓到的。
#
# 🔴 為什麼這一條對本 repo 特別重：@arkite-ui/core 裝在全艦隊 11 個前端上。
# 我們一個有弱點的傳遞依賴會同時出現在 11 份 lockfile 裡，而它們各自的
# pnpm audit 會把它報成**我們的**問題——卻只有我們修得掉。
#
# --prod 是刻意的：devDependencies 的弱點不會進到 consumer 手上。本 repo
# 完整 audit 有 43 筆，全部落在 storybook / jsdom 這些純開發鏈上；把它們
# 一起擋會產生大量「擋不掉也不該擋」的紅燈。
#
# 直接 allow_failure: false，不設 observation 期：導入時實測 `pnpm audit
# --prod` 為 0 弱點（dependencies 只有 clsx 與 tailwind-merge），baseline
# 本來就是清零的，沒有存量要 ratchet。紅了就修依賴，**不得回頭加
# allow_failure 遮掉**——那會讓新弱點混在存量裡看不見。
audit:
  stage: check
  <<: *node-setup
  script:
    - pnpm audit --prod
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# RSC/SSR 環境驗證:在真 Next.js App Router 下 build + 啟動 + Chromium 實測
# 「use client」邊界(Server Component 直取 tokens)與 hydration(零 console
# error + 互動可用)。playwright 官方 image 自帶瀏覽器。
# APG 鍵盤互動規格在真 Chromium 重跑(unit 是 jsdom;真瀏覽器的焦點/鍵盤
# 語意才是最終真相)。
keyboard:browser:
  stage: check
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  cache:
    # 與 node:22-alpine(musl)的 cache 分開:同 key 共用 node_modules 會讓
    # 平台原生二進位(rollup/esbuild)在 glibc/musl 間互踩,間歇性炸 pipeline
    key: ${CI_COMMIT_REF_SLUG}-playwright
    paths:
      - node_modules/
  before_script:
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm vitest run --project keyboard-browser
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

smoke:next:
  stage: check
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  cache:
    key: ${CI_COMMIT_REF_SLUG}-playwright
    paths:
      - node_modules/
  before_script:
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm run smoke:next
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# -------------------------------------------------------------------
# React 19 matrix
#
# peerDependencies permit ^18 || ^19, but every depth check above runs on
# the single React 18 install pinned in devDependencies. `smoke:next`
# exercises 19 (Next 15 fixture: RSC boundary, hydration, one interaction)
# — that is breadth, not depth. These jobs re-run the three depth checks
# against 19 so the peer range is backed by evidence rather than optimism.
#
# pnpm.overrides rather than `pnpm add react@19`: overrides rewrite the
# whole resolution tree, so Radix/cmdk/framer-motion/react-virtual resolve
# their react peer to 19 as well. Installing at the top level would leave
# a transitive 18 sitting underneath.
#
# --no-frozen-lockfile is required (overrides change resolution) and the
# lockfile edit stays inside the job — never commit it.
#
# ⚠️ The cache key MUST differ from the React 18 jobs. Same key means both
# installs share node_modules/ and stomp on each other's react version,
# which shows up as an unrelated-looking intermittent failure.
# -------------------------------------------------------------------

.react19-setup: &react19-setup
  before_script:
    - corepack enable && corepack prepare --activate
    - >
      node -e "const p=require('./package.json');
      p.pnpm={...p.pnpm, overrides:{...(p.pnpm&&p.pnpm.overrides),
      react:'19.x','react-dom':'19.x','@types/react':'19.x','@types/react-dom':'19.x'}};
      require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
    - pnpm install --no-frozen-lockfile --ignore-scripts
    - node -e "console.log('react', require('react/package.json').version, '| @types/react', require('@types/react/package.json').version)"

typecheck:react19:
  stage: check
  image: node:22-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}-react19
    paths:
      - node_modules/
  <<: *react19-setup
  script:
    - pnpm run typecheck
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

test:react19:
  stage: check
  image: node:22-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}-react19
    paths:
      - node_modules/
  <<: *react19-setup
  script:
    - pnpm run test
  # No coverage report here — the React 18 `test` job owns that artifact,
  # and two cobertura uploads on one pipeline overwrite each other.
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# main only. Shared runners are disabled and every job queues on a runner
# shared with the rest of the ecosystem, so a second playwright-image job on
# every MR would cost more wall-clock than it buys: jsdom already re-runs
# these same specs under React 19 in `test:react19`, and what this adds is
# real-Chromium focus and key semantics — worth catching on main, not worth
# doubling MR latency.
keyboard:browser:react19:
  stage: check
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  cache:
    key: ${CI_COMMIT_REF_SLUG}-react19-playwright
    paths:
      - node_modules/
  <<: *react19-setup
  script:
    - pnpm vitest run --project keyboard-browser
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

# -------------------------------------------------------------------
# Consumer-side type resolution
#
# Everything above type-checks core against one React at a time, inside our
# own repo. None of it can see which @types/react a CONSUMER's install tree
# links into core's variant directory — and that is decided by our peer
# declaration, not by our source. `typecheck:react19` passed green through
# the entire lifetime of the bug this job pins (GitLab #22).
#
# So this job leaves the repo: it packs the working tree, installs it into a
# throwaway workspace with two apps on DIFFERENT React majors, and requires
# both to type-check. It is the only check that exercises the published
# shape rather than the source.
#
# main only, on the same reasoning as keyboard:browser:react19 — it does two
# full dependency installs from the registry, which is real wall-clock on a
# shared runner. The tradeoff is accepted deliberately: a
# regression here lands on main before it is caught. It is cheap to catch
# there because the guard at the top of the script fails in seconds, and the
# failure mode is a publish-shape change, which only happens on purpose.
# -------------------------------------------------------------------
types:mixed-major:
  stage: check
  image: node:22-alpine
  # node:22-alpine has no bash — /bin/sh is busybox — and the verify script
  # is #!/bin/bash, so without this the job dies on exit 127. Same trap that
  # bit changeset:check with `git: not found`, and main-only jobs surface it
  # only after merge. Verified against the real image, not assumed.
  before_script:
    - apk add --no-cache bash
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm build
    - ./scripts/verify-types-mixed-major.sh
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

size:
  stage: check
  <<: *node-setup
  script:
    - pnpm run build
    - pnpm run size
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# 有程式碼異動卻沒附 changeset 就擋下 MR。
# 純內部異動（不影響 consumer）用 `pnpm changeset --empty` 過閘。
# 前端架構合規檢查（arkite-frontend 附錄 C，issue #23）
#
# 為什麼 arkite-ui 要有這個 job：舊版 generate-snapshot.sh 把本 repo 放在
# EXCLUDE，理由寫的是「producer：設計系統（有自己的 audit-consumers.sh）」
# ——那句話只涵蓋了「它稽核別人」，**沒有涵蓋「誰稽核它」**。而 @arkite-ui/core
# 是全艦隊 11 個前端的共同依賴，我們的 secret 掃描、audit 閘門、憑證設定出問題
# 都會傳染出去。上游已於 2026-08-24 把 producer 移進合規對帳。
#
# 🔴 釘住上游的**確切 commit**，不釘 tag 名：這是必過 gate，`clone --depth 1`
# 上游 main 等於「我們合不合得了 MR，取決於別的 repo 此刻的 HEAD」。ark-museum
# 2026-08-22 實際被咬過（scanner 把註解裡的 dangerouslySetInnerHTML 判成注入點，
# 白等 4.5 小時）。tag 名也不夠——tag 可以被強制移動，SHA 不會。
#
# ⚠️ 本 repo 自己就踩過釘錯版的坑：issue #23 原本建議釘 scanner-2026-08-24
# （f9c3813），但修掉 3 個 library 誤判的 !33 落在那個 tag **之後**——用該 SHA
# 實測本 repo 是 22/8/5，用含 !33 的版本才是 33/0/0。**升版前先確認新版含你需要
# 的修正**：git merge-base --is-ancestor <修正commit> <新tag>。
#
# 📌 怎麼升：git ls-remote --tags git@gitlab.com:foson.co/arkite-frontend.git
# 取新 tag 的 ^{} commit，改下面兩行，**在同一個 MR 裡跑一次確認仍是 0 fail**。
# 升級是刻意動作，不是自動漂移——這正是釘住的目的。
#
# 導入時實測（scanner a3783f6 對 origin/main 97b2dd0）：33 通過 / 0 警告 /
# 0 未通過，所以直接必過、不設 observation 期。紅了就修，**不得回頭加
# allow_failure 遮掉**。若是上游誤報，先開 arkite-frontend issue。
frontend-compliance:
  stage: check
  image: node:22  # 腳本需要 node + git
  variables:
    ARKITE_FRONTEND_TAG: "scanner-2026-08-24-2"  # 只為可讀
    # 這是 git commit SHA、不是密鑰；detect-secrets 只看得到 40 位 hex 高熵字串
    ARKITE_FRONTEND_SHA: "a3783f6b63bfbeea72f8b0ca6547914751e18688"  # pragma: allowlist secret
  script:
    # 按 SHA 淺層抓取（GitLab 支援 fetch 任意 commit）；不用 clone --branch <tag>，
    # 那只釘得住 tag 名、釘不住內容。
    - mkdir -p /tmp/arkite-frontend && cd /tmp/arkite-frontend && git init -q .
    - >-
      git fetch -q --depth 1
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/foson.co/arkite-frontend.git"
      "$ARKITE_FRONTEND_SHA"
    - git checkout -q FETCH_HEAD
    - echo "arkite-frontend scanner 釘於 ${ARKITE_FRONTEND_TAG} (${ARKITE_FRONTEND_SHA})"
    - /tmp/arkite-frontend/scripts/check-compliance.sh "$CI_PROJECT_DIR"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

changeset:check:
  stage: check
  <<: *node-setup
  # node:22-alpine ships without git, and this job's first command is a
  # `git fetch` — so it died on `git: not found` (exit 127) the first time
  # it ever ran. It only triggers on MR pipelines, and this repo had no MRs
  # until !1, so the job sat unexercised since the day it was written.
  before_script:
    - apk add --no-cache git
    - corepack enable && corepack prepare --activate
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    # The runner clones shallow (GIT_DEPTH 20); fetch main so --since can
    # resolve it.
    - git fetch origin main:refs/remotes/origin/main
    - pnpm changeset status --since=origin/main
  rules:
    - if: $CI_MERGE_REQUEST_IID

build:
  stage: build
  <<: *node-setup
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# -------------------------------------------------------------------
# Publish: only on tags on main branch
# (Storybook is deployed to GitHub Pages via .github/workflows/deploy-storybook.yml)
#
# ⚠️ Both publish jobs pin `tags:` explicitly rather than inheriting the
# default. This repo has no deploy job — its release path is `pnpm publish`,
# and per the warning at the top of this file that path is never exercised by
# an MR pipeline; it is first proven at release. Inheriting meant a one-line
# edit to `default: tags:` silently moved npm publishing to another runner,
# and the failure would surface at `git tag`, not in review. Pinned here so
# the release runner only ever changes on purpose.
# -------------------------------------------------------------------

publish:gitlab:
  stage: publish
  image: node:22-alpine
  tags:
    - Ark-Stage
  dependencies:
    - build
  variables:
    HUSKY: "0"
  before_script:
    - corepack enable && corepack prepare --activate
  script:
    # 用 CI_JOB_TOKEN，不是長期 deploy token（§5.22 / §D.10，issue #23）。
    # 這是**發到自己的 project**（CI_PROJECT_ID），job token 天生就有寫入權；
    # §D.8 那條「必須用 deploy token」是從「deploy token 必須走 Basic auth」
    # 推出來的、從未驗證的推論，艦隊照著它維護了一年的長期憑證。
    # 2026-08-15 上游實測（pipeline 2762693254）：CI_JOB_TOKEN + _authToken=
    # 可以 publish，自己專案與跨專案都通。
    #
    # ⚠️ 依本檔開頭的警告，publish 路徑不會被 MR pipeline 驗到，第一次證明
    # 是在 release 當下。回滾方式：把下面那行改回 ${PUBLISH_TOKEN}（CI
    # variable 先留著別刪，確認下一次發版成功後再移除）。
    # 風險面比看起來小：consumer 早已改從公開 npmjs 取用，GitLab registry
    # 這份近幾版的 last_downloaded_at 都是 null。
    - |
      echo "@arkite-ui:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - pnpm publish --no-git-checks
  rules:
    # 只認版本 tag。原本是裸的 `$CI_COMMIT_TAG`——**任何** tag 都會觸發一次
    # 發布嘗試，包括之後可能出現的非版本 tag（上游 arkite-frontend 就為了
    # scanner 另開了 scanner-YYYY-MM-DD 命名空間，正是為了避免這件事）。
    # 對照 publish:npm 本來就有兩層（$CI_COMMIT_TAG && $NPM_TOKEN），這裡補齊。
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

publish:npm:
  stage: publish
  image: node:22-alpine
  tags:
    - Ark-Stage
  dependencies:
    - build
  variables:
    HUSKY: "0"
  before_script:
    - corepack enable && corepack prepare --activate
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - pnpm publish --no-git-checks --access public
  rules:
    - if: $CI_COMMIT_TAG && $NPM_TOKEN

<style>
  /* Deep-skin overrides. Stable selectors only (semantic ids / data-attrs);
     if Storybook renames one, that rule silently reverts to default —
     never target hashed emotion classes. */

  /* Sidebar: neutralize the multicolor type icons, soften rows */
  #storybook-explorer-tree .sidebar-item {
    border-radius: 7px;
  }
  #storybook-explorer-tree .sidebar-item svg {
    color: #a4a9b4;
  }
  #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
    color: #ffffff;
  }
  .sidebar-subheading {
    font-size: 10.5px;
    letter-spacing: 0.09em;
    font-weight: 700;
  }

  /* Quiet, thin scrollbars */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-thumb {
    background: #d4d7dd;
    border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #b8bcc4;
  }
  ::-webkit-scrollbar-track,
  ::-webkit-scrollbar-corner {
    background: transparent;
  }

  /* Persistent site header shared with the landing page: the manager app
     (#root) is pushed down 48px and the header is injected below. */
  #root {
    top: 56px !important;
    bottom: 0 !important;
    height: auto !important;
  }
  #arkite-site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 24px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
  }
  #arkite-site-header .wm {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 650;
    color: #16181d;
    text-decoration: none;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  #arkite-site-header .wm span {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: #6a4dff;
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 15px;
  }
  #arkite-site-header .lk {
    margin-left: auto;
    display: flex;
    gap: 22px;
  }
  #arkite-site-header .lk a {
    color: #6b7280;
    text-decoration: none;
  }
  #arkite-site-header .lk a:hover {
    color: #16181d;
  }
  #arkite-site-header .lk a.on {
    color: #6a4dff;
    font-weight: 550;
  }
  #arkite-site-header .lk a.cta {
    color: #6a4dff;
    font-weight: 550;
  }
  /* The injected header already carries the wordmark — drop the
     sidebar's duplicate brand block (title comes from our brandTitle). */
  .sidebar-header a[title='Arkite UI'] {
    display: none;
  }
</style>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var h = document.createElement('header')
    h.id = 'arkite-site-header'
    h.innerHTML =
      '<a class="wm" href="../"><span>A</span>Arkite UI</a>' +
      '<nav class="lk">' +
      '<a data-nav="components" href="./">Components</a>' +
      '<a data-nav="docs" href="./?path=/docs/getting-started--docs">Docs</a>' +
      '<a data-nav="tokens" href="./?path=/docs/foundation-design-tokens--docs">Tokens</a>' +
      '<a href="https://github.com/foson-co/arkite-ui">GitHub</a>' +
      '<a class="cta" href="https://starter.foson.co">Live demo \u2192</a>' +
      '</nav>'
    document.body.prepend(h)

    // Storybook is an SPA: ?path= changes via pushState (no event), so poll
    // lightly and move the highlight to match the section being viewed.
    var DOCS =
      /\/docs\/(introduction|getting-started|accessibility|component-guidelines|form-patterns)--/
    var TOKENS = /\/docs\/foundation-/
    var last = null
    function update() {
      var path = new URLSearchParams(location.search).get('path') || ''
      if (path === last) return
      last = path
      var active = TOKENS.test(path) ? 'tokens' : DOCS.test(path) ? 'docs' : 'components'
      h.querySelectorAll('[data-nav]').forEach(function (a) {
        a.classList.toggle('on', a.getAttribute('data-nav') === active)
      })
    }
    update()
    setInterval(update, 400)
  })
</script>
